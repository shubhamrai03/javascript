<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corporate Connect Series</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid py-4">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col-12">
                <h2 class="text-center fw-bold text-dark mb-0">Corporate Connect Series</h2>
            </div>
        </div>

        <!-- Image Gallery -->
        <div class="row g-3">
            <!-- Image 1 - Award/Recognition Ceremony -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1560472354-b33ff0c44a43?w=600&h=400&fit=crop&crop=center" 
                         alt="Award Ceremony" class="img-fluid rounded shadow-sm">
                </div>
            </div>

            <!-- Image 2 - Large Audience -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1515187029135-18ee286d815b?w=600&h=400&fit=crop&crop=center" 
                         alt="Corporate Audience" class="img-fluid rounded shadow-sm">
                </div>
            </div>

            <!-- Image 3 - Group Photo -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?w=600&h=400&fit=crop&crop=center" 
                         alt="Team Group Photo" class="img-fluid rounded shadow-sm">
                </div>
            </div>

            <!-- Image 4 - Team Meeting -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?w=600&h=400&fit=crop&crop=center" 
                         alt="Team Meeting" class="img-fluid rounded shadow-sm">
                </div>
            </div>

            <!-- Image 5 - Conference Presentation -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&h=400&fit=crop&crop=center" 
                         alt="Conference Presentation" class="img-fluid rounded shadow-sm">
                </div>
            </div>

            <!-- Image 6 - Speaker Presentation -->
            <div class="col-lg-4 col-md-6 col-12">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1475721027785-f74eccf877e2?w=600&h=400&fit=crop&crop=center" 
                         alt="Speaker Presentation" class="img-fluid rounded shadow-sm">
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script>
        // Image loading optimization
        document.addEventListener('DOMContentLoaded', function() {
            const images = document.querySelectorAll('.gallery-item img');
            
            images.forEach(img => {
                img.addEventListener('load', function() {
                    this.style.opacity = '1';
                });
                
                // Add click event for basic lightbox effect
                img.addEventListener('click', function() {
                    const modal = document.createElement('div');
                    modal.className = 'image-modal';
                    modal.innerHTML = `
                        <div class="modal-backdrop" onclick="this.parentElement.remove()">
                            <img src="${this.src}" alt="${this.alt}" class="modal-image">
                            <span class="close-btn">&times;</span>
                        </div>
                    `;
                    document.body.appendChild(modal);
                });
            });
        });
    </script>
    
    <style>
        .image-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1050;
            cursor: pointer;
        }
        
        .modal-image {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</body>
</html>
